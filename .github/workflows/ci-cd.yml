name: Workify CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Lint & Test
  # ----------------------------------------------------------------------------
  test-backend:
    name: Backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: workify_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Checks & Migrations
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/workify_test
          SECRET_KEY: ci-test-secret-key
          DEBUG: '0'
        run: |
          cd backend
          python manage.py check

  # ----------------------------------------------------------------------------
  # 2. ML Service CI
  # ----------------------------------------------------------------------------
  test-ml-service:
    name: ML Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt

      - name: ML Syntax & Import Validation
        run: |
          cd ml-service
          python -c "import main; print('ML service imports and FastAPI app valid!')"

  # ----------------------------------------------------------------------------
  # 3. Frontend Build CI
  # ----------------------------------------------------------------------------
  test-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build React App
        run: |
          cd frontend
          npm run build

  # ----------------------------------------------------------------------------
  # 4. Docker Compose Orchestration Check
  # ----------------------------------------------------------------------------
  docker-validation:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [test-backend, test-ml-service, test-frontend]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build All Docker Containers
        run: |
          docker compose build

  # ----------------------------------------------------------------------------
  # 5. Build & Push Docker Images to AWS ECR  (main branch only)
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push to AWS ECR
    runs-on: ubuntu-latest
    needs: [docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/workify-backend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/workify-backend:latest \
                       ./backend
          docker push $ECR_REGISTRY/workify-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/workify-backend:latest
          echo "Backend image pushed: $ECR_REGISTRY/workify-backend:$IMAGE_TAG"

      - name: Build & Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/workify-frontend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/workify-frontend:latest \
                       ./frontend
          docker push $ECR_REGISTRY/workify-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/workify-frontend:latest
          echo "Frontend image pushed: $ECR_REGISTRY/workify-frontend:$IMAGE_TAG"

      - name: Build & Push ML Service Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/workify-ml:$IMAGE_TAG \
                       -t $ECR_REGISTRY/workify-ml:latest \
                       ./ml-service
          docker push $ECR_REGISTRY/workify-ml:$IMAGE_TAG
          docker push $ECR_REGISTRY/workify-ml:latest
          echo "ML service image pushed: $ECR_REGISTRY/workify-ml:$IMAGE_TAG"

  # ----------------------------------------------------------------------------
  # 6. Deploy to EC2 via SSH  (main branch only)
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GITHUB_SHA
          script: |
            set -e
            echo "=== Deploying Workify — commit $GITHUB_SHA ==="

            # Pull latest code
            cd /home/ubuntu/workify
            git pull origin main

            # Login to ECR
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Export image tag
            export IMAGE_TAG=$GITHUB_SHA
            export ECR_REGISTRY=${{ secrets.ECR_REGISTRY }}

            # Pull new images
            docker pull $ECR_REGISTRY/workify-backend:$IMAGE_TAG
            docker pull $ECR_REGISTRY/workify-frontend:$IMAGE_TAG
            docker pull $ECR_REGISTRY/workify-ml:$IMAGE_TAG

            # Tag as latest locally
            docker tag $ECR_REGISTRY/workify-backend:$IMAGE_TAG  workify-backend:latest
            docker tag $ECR_REGISTRY/workify-frontend:$IMAGE_TAG workify-frontend:latest
            docker tag $ECR_REGISTRY/workify-ml:$IMAGE_TAG       workify-ml:latest

            # Rolling restart (zero-downtime)
            docker compose -f devops/aws/docker-compose.prod.yml \
              up -d --no-deps --no-build backend frontend ml-service

            # Cleanup old images to free disk space
            docker image prune -f

            echo "=== ✅ Deployment complete! Running commit: $IMAGE_TAG ==="
