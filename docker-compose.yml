version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: workify_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workify_db}
      POSTGRES_USER: ${POSTGRES_USER:-workify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workify_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workify_user} -d ${POSTGRES_DB:-workify_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis (Cache, Celery Broker & Real-time Availability)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: workify_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Main Backend API (Django REST Framework)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workify_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgres://${POSTGRES_USER:-workify_user}:${POSTGRES_PASSWORD:-workify_secret}@postgres:5432/${POSTGRES_DB:-workify_db}
      - REDIS_URL=redis://redis:6379/0
      - ML_SERVICE_URL=http://ml-service:5001
      - SECRET_KEY=${SECRET_KEY:-django-insecure-workify-key-change-in-prod}
      - ALLOWED_HOSTS=*
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. ML Service (FastAPI / Recommendation & Elo Engine)
  # ---------------------------------------------------------------------------
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: workify_ml_service
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 5001 --reload
    volumes:
      - ./ml-service:/app
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 5. Frontend (React / Vite)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workify_frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_ML_URL=http://localhost:5001
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
